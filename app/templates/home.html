<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
</head>
<body>
    <main>
        <h1>Welcome, {{ username }}!</h1>
        <p>You are logged in.</p>
        
        <section>
            <h2>Create a post</h2>
            <form method="post" action="/posts/create">
                <label for="content">What's on your mind?</label>
                <textarea
                    id="content"
                    name="content"
                    rows="4"
                    required
                ></textarea>
                <button type="submit">Publish</button>
            </form>
        </section>

        <section>
            <h2>Posts</h2>
            {% for post in posts %}
                <article>
                    <p>{{ post["content"] }}</p>
                    <small>
                        By {{ post["username"] }} · {{ post["created_at"] }}
                    </small>
                </article>
            {% else %}
                <p>No posts yet.</p>
            {% endfor %}
        </section>

        <form method="post" action="{{ url_for('main.logout') }}">
            <button type="submit">Log out</button>
        </form>
    </main>
</body>
</html>
